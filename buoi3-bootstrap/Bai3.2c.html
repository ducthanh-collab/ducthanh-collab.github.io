<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Bài 3.2c: Toolbar button group</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />

        <!-- Thư viện Bootstrap Icons -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        />
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>

        <main class="container mt-4">
            <h2>Bài 3.2c: Toolbar soạn thảo</h2>
            <div class="mt-3">
                <!-- btn-toolbar dùng để gộp nhiều btn-group trên 1 hàng ngang -->
                <div class="btn-toolbar" role="toolbar" aria-label="Toolbar soạn thảo">
                    
                    <!-- Nhóm 1: T, B (Bold), I (Italic), U (Underline) -->
                    <div class="btn-group me-2" role="group">
                        <button type="button" class="btn btn-dark"><strong>T</strong></button>
                        <button type="button" class="btn btn-dark"><strong>B</strong></button>
                        <button type="button" class="btn btn-dark"><em>I</em></button>
                        <button type="button" class="btn btn-dark"><u>U</u></button>
                    </div>

                    <!-- Nhóm 2: Căn lề trái, giữa, phải, đều 2 bên -->
                    <div class="btn-group me-2" role="group">
                        <button type="button" class="btn btn-dark"><i class="bi bi-text-left"></i></button>
                        <button type="button" class="btn btn-dark"><i class="bi bi-text-center"></i></button>
                        <button type="button" class="btn btn-dark"><i class="bi bi-text-right"></i></button>
                        <button type="button" class="btn btn-dark"><i class="bi bi-justify"></i></button>
                    </div>

                    <!-- Nhóm 3: Nút Code <> -->
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-dark"><i class="bi bi-code-slash"></i></button>
                    </div>

                </div>
            </div>
        </main>

        <footer>
            <!-- place footer here -->
        </footer>

        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
