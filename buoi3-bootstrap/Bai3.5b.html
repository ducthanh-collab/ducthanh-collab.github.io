<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Bài 3.5b: Registration Form</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>

        <main class="container mt-4 mb-5" style="max-width: 650px;">
            <h2>Bài 3.5b: Registration Form</h2>
            
            <form action="/action_page.php" class="mt-3">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="firstName" class="form-label">First Name:</label>
                        <input type="text" class="form-control" id="firstName" placeholder="Enter first name" name="firstName" required>
                    </div>
                    <div class="col-md-6">
                        <label for="lastName" class="form-label">Last Name:</label>
                        <input type="text" class="form-control" id="lastName" placeholder="Enter last name" name="lastName" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="emailAddress" class="form-label">Email Address:</label>
                    <input type="email" class="form-control" id="emailAddress" placeholder="Enter email address" name="emailAddress" required>
                </div>

                <div class="mb-3">
                    <label for="mobileNumber" class="form-label">Mobile Number:</label>
                    <input type="tel" class="form-control" id="mobileNumber" placeholder="Enter mobile number" name="mobileNumber">
                </div>

                <div class="mb-3">
                    <label for="dob" class="form-label">Date of Birth:</label>
                    <input type="date" class="form-control" id="dob" name="dob">
                </div>

                <div class="mb-3">
                    <label for="postalAddress" class="form-label">Postal Address:</label>
                    <textarea class="form-control" id="postalAddress" rows="3" placeholder="Enter address" name="postalAddress"></textarea>
                </div>

                <div class="mb-3">
                    <label for="zipCode" class="form-label">Zip Code:</label>
                    <input type="text" class="form-control" id="zipCode" placeholder="Enter zip code" name="zipCode">
                </div>

                <div class="mb-3">
                    <label for="uploadPhoto" class="form-label">Upload Photo:</label>
                    <input class="form-control" type="file" id="uploadPhoto" name="photo">
                </div>
                <div class="mb-3">
                    <label class="form-label d-block">Gender:</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="male" value="male" checked>
                        <label class="form-check-label" for="male">Male</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="female" value="female">
                        <label class="form-check-label" for="female">Female</label>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Register</button>
            </form>
        </main>

        <footer>
            <!-- place footer here -->
        </footer>

        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
